alerts:
  - name: high_p95_latency
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success_rate
    severity: warning
    condition: retrieval_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-3
